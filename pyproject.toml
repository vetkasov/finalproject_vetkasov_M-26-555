[project]
name = "finalproject_vetkasov_M-26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор валютного портфеля"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4", "requests>=2.32,<3"]

[project.scripts]
project = "main:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.hatch.build.targets.sdist]
include = [
    "valutatrade_hub",
    "main.py",
    "README.md",
    "Makefile",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
log_dir = "logs"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_format = "%(levelname)s %(asctime)s %(name)s %(message)s"
log_level = "INFO"
log_max_bytes = 1048576
log_backups = 3
