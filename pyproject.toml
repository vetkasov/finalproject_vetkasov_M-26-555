[project]
name = "finalproject_vetkasov_M-26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор валютного портфеля"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4"]

[project.scripts]
project = "main:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["valutatrade_hub", "main.py", "README.md", "Makefile", "pyproject.toml", "uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I"]
